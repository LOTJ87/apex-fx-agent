<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX FX — Professional Trade Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg:#05080d;--surface:#090e15;--card:#0c1219;--border:#141e2c;--border2:#1c2a3a;
  --gold:#c9a84c;--gold2:#f0d080;--green:#2ecc8a;--red:#e8445a;--blue:#4a9eff;
  --text:#d4dde8;--muted:#3d5068;--muted2:#5a7291;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:.35;}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);z-index:1000;}
.wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px;}

/* HEADER */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:48px;padding-bottom:24px;border-bottom:1px solid var(--border);}
.brand-name{font-family:var(--display);font-size:52px;letter-spacing:6px;color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(201,168,76,.25);}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--muted2);text-transform:uppercase;margin-top:3px;}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.agent-st{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;}
.st-pip{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .4s;}
.st-pip.live{background:var(--green);box-shadow:0 0 10px rgba(46,204,138,.6);animation:blink 2.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.week-t{font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:1px;}
.week-t span{color:var(--gold);}

/* NEWS */
.news-alert{display:none;align-items:center;gap:12px;padding:12px 20px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:3px;margin-bottom:20px;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--gold2);animation:fadeIn .4s ease;}
.news-alert.show{display:flex;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media(max-width:500px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:3px;padding:14px 16px;text-align:center;}
.stat-n{font-family:var(--display);font-size:28px;letter-spacing:2px;color:var(--text);line-height:1;margin-bottom:4px;}
.stat-n.gold{color:var(--gold);}.stat-n.green{color:var(--green);}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

/* CONFIG GRID */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:620px){.cfg-grid{grid-template-columns:1fr;}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;}
.p-lbl{font-family:var(--mono);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:20px;display:flex;align-items:center;gap:10px;}
.p-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
.field{margin-bottom:16px;}.field:last-child{margin-bottom:0;}
.f-lbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);margin-bottom:7px;}
.field input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:3px;padding:10px 14px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.1);}
.field input::placeholder{color:var(--muted);}

/* CHIPS */
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:3px;cursor:pointer;transition:all .2s;user-select:none;}
.chip input{display:none;}
.chip.on{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.04);}
.chip-dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);transition:all .2s;flex-shrink:0;}
.chip.on .chip-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(201,168,76,.5);}
.chip-t{font-family:var(--mono);font-size:12px;color:var(--muted2);letter-spacing:1px;transition:color .2s;}
.chip.on .chip-t{color:var(--gold2);}

/* INTERVAL */
.iv-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
.iv-btn{padding:8px 4px;text-align:center;background:var(--bg);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:11px;color:var(--muted2);cursor:pointer;transition:all .2s;letter-spacing:1px;}
.iv-btn.on{border-color:var(--blue);color:var(--blue);background:rgba(74,158,255,.06);}

/* BUTTONS */
.btn-on{width:100%;padding:18px;background:transparent;border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-family:var(--display);font-size:20px;letter-spacing:6px;cursor:pointer;transition:all .25s;margin-bottom:12px;position:relative;overflow:hidden;}
.btn-on::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));transform:translateX(-100%);transition:transform .3s;}
.btn-on:hover{color:var(--gold2);box-shadow:0 0 30px rgba(201,168,76,.15);}
.btn-on:hover::before{transform:translateX(0);}
.btn-on:disabled{border-color:var(--muted);color:var(--muted);cursor:not-allowed;}
.btn-off{width:100%;padding:14px;background:transparent;border:1px solid var(--border2);border-radius:4px;color:var(--muted2);font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .2s;display:none;margin-bottom:12px;}
.btn-off:hover{border-color:var(--red);color:var(--red);}

/* COUNTDOWN */
.cd-bar{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:3px;margin-bottom:24px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--muted2);}
.cd-bar.show{display:flex;}
.cd-val{color:var(--blue);font-size:14px;}

/* FEED */
.feed-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.feed-title{font-family:var(--display);font-size:22px;letter-spacing:4px;color:var(--text);}
.feed-meta{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;}

/* TRADE CARD */
.tc{background:var(--card);border:1px solid var(--border);border-radius:4px;margin-bottom:14px;overflow:hidden;animation:slideUp .4s cubic-bezier(.16,1,.3,1);position:relative;}
@keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.tc-acc{position:absolute;top:0;left:0;bottom:0;width:3px;}
.tc-acc.buy{background:var(--green);}.tc-acc.sell{background:var(--red);}.tc-acc.wait{background:var(--gold);}.tc-acc.none{background:var(--muted);}
.tc-inner{padding:20px 20px 20px 26px;}
.tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.tc-sym{font-family:var(--display);font-size:30px;letter-spacing:3px;color:var(--text);}
.tc-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.dir-badge{font-family:var(--display);font-size:14px;letter-spacing:4px;padding:5px 14px;border-radius:2px;}
.dir-badge.buy{background:rgba(46,204,138,.12);color:var(--green);border:1px solid rgba(46,204,138,.25);}
.dir-badge.sell{background:rgba(232,68,90,.12);color:var(--red);border:1px solid rgba(232,68,90,.25);}
.dir-badge.wait{background:rgba(201,168,76,.1);color:var(--gold2);border:1px solid rgba(201,168,76,.2);}
.dir-badge.none{background:rgba(61,80,104,.15);color:var(--muted2);border:1px solid var(--border2);}
.tc-strat{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;}

/* LEVELS */
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;padding:14px;background:rgba(0,0,0,.3);border-radius:3px;border:1px solid var(--border);}
@media(max-width:500px){.levels{grid-template-columns:repeat(3,1fr);}}
.lv-item{text-align:center;}
.lv-lbl{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.lv-val{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);}
.lv-val.e{color:var(--blue);}.lv-val.s{color:var(--red);}.lv-val.t{color:var(--green);}.lv-val.r{color:var(--gold2);}

/* ANALYSIS */
.tc-analysis{font-family:var(--sans);font-size:13px;line-height:1.7;color:var(--muted2);border-top:1px solid var(--border);padding-top:14px;}
.tc-analysis strong{color:var(--text);font-weight:500;}
.tc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.tc-time{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;}
.conf-row{display:flex;align-items:center;gap:8px;}
.conf-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.conf-dots{display:flex;gap:3px;}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--border2);}
.cdot.lit{background:var(--gold);}

/* LOG */
.log-wrap{background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-top:24px;}
.log-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);}
.log-lbl{font-family:var(--mono);font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--muted2);}
.log-clr{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;transition:color .2s;}
.log-clr:hover{color:var(--text);}
.log-out{height:220px;overflow-y:auto;padding:14px 20px;font-family:var(--mono);font-size:11px;line-height:1.9;}
.log-out::-webkit-scrollbar{width:3px;}.log-out::-webkit-scrollbar-thumb{background:var(--border2);}
.ll{display:flex;gap:14px;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.ll-t{color:var(--muted);flex-shrink:0;}.ll-i{color:var(--muted2);}.ll-s{color:var(--green);}.ll-w{color:var(--gold2);}.ll-e{color:var(--red);}.ll-a{color:#ffd700;font-weight:500;}
.log-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:11px;letter-spacing:3px;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div>
      <div class="brand-name">APEX FX</div>
      <div class="brand-sub">Professional Trade Intelligence · AI-Powered</div>
    </div>
    <div class="hdr-r">
      <div class="agent-st"><div class="st-pip" id="sPip"></div><span id="sTxt">OFFLINE</span></div>
      <div class="week-t">Week target: <span id="wkCount">0</span>/3 signals</div>
    </div>
  </div>

  <div class="news-alert" id="newsBanner"><span style="font-size:16px;flex-shrink:0">⚡</span><span id="newsText"></span></div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-n gold" id="stScans">0</div><div class="stat-lbl">Scans Run</div></div>
    <div class="stat-box"><div class="stat-n" id="stSigs">0</div><div class="stat-lbl">Signals Fired</div></div>
    <div class="stat-box"><div class="stat-n green" id="stWeek">0/3</div><div class="stat-lbl">Week Progress</div></div>
    <div class="stat-box"><div class="stat-n" id="stNext">—</div><div class="stat-lbl">Next Scan</div></div>
  </div>

  <div class="cfg-grid">
    <div class="panel">
      <div class="p-lbl">Telegram Delivery</div>
      <div class="field"><label class="f-lbl">Anthropic API Key</label><input type="password" id="fApiKey" placeholder="sk-ant-api03-..."/></div>
      <div class="field"><label class="f-lbl">Bot Token</label><input type="password" id="fTok" placeholder="1234567890:AAFxyz..."/></div>
      <div class="field"><label class="f-lbl">Chat ID</label><input type="text" id="fChat" placeholder="Numeric Chat ID"/></div>
      <div class="field">
        <label class="f-lbl">Scan Frequency</label>
        <div class="iv-row">
          <div class="iv-btn" data-v="15">15m</div>
          <div class="iv-btn on" data-v="30">30m</div>
          <div class="iv-btn" data-v="60">1hr</div>
          <div class="iv-btn" data-v="240">4hr</div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="p-lbl">Instruments</div>
      <div class="chip-grid" style="margin-bottom:18px">
        <label class="chip on"><input type="checkbox" checked data-sym="EURUSD"><div class="chip-dot"></div><span class="chip-t">EUR/USD</span></label>
        <label class="chip on"><input type="checkbox" checked data-sym="GBPUSD"><div class="chip-dot"></div><span class="chip-t">GBP/USD</span></label>
        <label class="chip on"><input type="checkbox" checked data-sym="XAUUSD"><div class="chip-dot"></div><span class="chip-t">XAU/USD</span></label>
        <label class="chip on"><input type="checkbox" checked data-sym="WTIUSD"><div class="chip-dot"></div><span class="chip-t">WTI Oil</span></label>
      </div>
      <div class="p-lbl">Strategies</div>
      <div class="chip-grid">
        <label class="chip on"><input type="checkbox" checked data-strat="SR_PA"><div class="chip-dot"></div><span class="chip-t">S&R + PA</span></label>
        <label class="chip on"><input type="checkbox" checked data-strat="LONDON_BO"><div class="chip-dot"></div><span class="chip-t">London BO</span></label>
        <label class="chip on"><input type="checkbox" checked data-strat="BREAKOUT"><div class="chip-dot"></div><span class="chip-t">Breakout</span></label>
        <label class="chip on"><input type="checkbox" checked data-strat="MA_CROSS"><div class="chip-dot"></div><span class="chip-t">MA Cross</span></label>
      </div>
    </div>
  </div>

  <button class="btn-on" id="btnOn" onclick="startAgent()">ACTIVATE AGENT</button>
  <button class="btn-off" id="btnOff" onclick="stopAgent()">STOP AGENT</button>

  <div class="cd-bar" id="cdBar">
    <span style="font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted2)" id="scanLbl">SCAN #0</span>
    <span style="font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted2)">NEXT SCAN IN</span>
    <span class="cd-val" id="cdVal">—</span>
  </div>

  <div class="feed-hdr">
    <div class="feed-title">LIVE SIGNALS</div>
    <div class="feed-meta" id="feedMeta">Awaiting activation</div>
  </div>
  <div id="cardsArea"></div>

  <div class="log-wrap">
    <div class="log-top">
      <div class="log-lbl">Agent Log</div>
      <button class="log-clr" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-out" id="logOut"><div class="log-empty">Inactive</div></div>
  </div>

</div>
<script>
let running=false,cdTimer=null,nextAt=null,scanN=0,weekSigs=0,totalSigs=0,scanMins=30;

document.querySelectorAll('.iv-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.iv-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');scanMins=parseInt(b.dataset.v);
    if(running){log('w','Interval → '+scanMins+'m');resetTimer();}
  };
});
document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{c.classList.toggle('on');c.querySelector('input').checked=c.classList.contains('on');});
});

const syms=()=>[...document.querySelectorAll('[data-sym]')].filter(e=>e.checked).map(e=>e.dataset.sym);
const strats=()=>[...document.querySelectorAll('[data-strat]')].filter(e=>e.checked).map(e=>e.dataset.strat);
const ts=()=>new Date().toTimeString().slice(0,8);

function log(t,m){
  const out=document.getElementById('logOut');
  const emp=out.querySelector('.log-empty');if(emp)emp.remove();
  const d=document.createElement('div');d.className='ll';
  d.innerHTML=`<span class="ll-t">${ts()}</span><span class="ll-${t}">${m}</span>`;
  out.appendChild(d);out.scrollTop=out.scrollHeight;
}
function clearLog(){document.getElementById('logOut').innerHTML='<div class="log-empty">Cleared</div>';}
function setStatus(live,txt){
  document.getElementById('sPip').className='st-pip'+(live?' live':'');
  document.getElementById('sTxt').textContent=txt;
}
function updateStats(){
  document.getElementById('stScans').textContent=scanN;
  document.getElementById('stSigs').textContent=totalSigs;
  document.getElementById('stWeek').textContent=weekSigs+'/3';
  document.getElementById('wkCount').textContent=weekSigs;
}

function getNews(){
  const n=new Date(),y=n.getUTCFullYear(),m=n.getUTCMonth()+1,d=n.getUTCDate(),h=n.getUTCHours();
  const ev=[];
  // NFP dates 2026
  [[2026,5,8],[2026,6,5],[2026,7,2],[2026,8,7]].forEach(([ey,em,ed])=>{
    if(y===ey&&m===em){
      if(d===ed&&h>=12&&h<=15)ev.push({name:'NFP RELEASE',impact:'CRITICAL',window:'NOW — DO NOT TRADE'});
      else if(d===ed&&h<13)ev.push({name:'NFP Today 13:30 UTC',impact:'HIGH',window:'TODAY'});
      else if(d===ed-1)ev.push({name:'NFP Tomorrow 13:30 UTC',impact:'HIGH',window:'TOMORROW'});
    }
  });
  // FOMC 2026
  [[2026,6,17],[2026,7,29],[2026,9,16],[2026,11,4]].forEach(([ey,em,ed])=>{
    if(y===ey&&m===em){
      if(d===ed)ev.push({name:'FOMC Decision Day',impact:'CRITICAL',window:'TODAY'});
      else if(d===ed-1)ev.push({name:'FOMC Tomorrow',impact:'HIGH',window:'TOMORROW'});
    }
  });
  // CPI 2026
  [[2026,5,12],[2026,6,11],[2026,7,14],[2026,8,12]].forEach(([ey,em,ed])=>{
    if(y===ey&&m===em){
      if(d===ed)ev.push({name:'US CPI Release',impact:'HIGH',window:'TODAY'});
      else if(d===ed-1)ev.push({name:'US CPI Tomorrow',impact:'MEDIUM',window:'TOMORROW'});
    }
  });
  return ev;
}

function showBanner(ev){
  const b=document.getElementById('newsBanner'),t=document.getElementById('newsText');
  if(ev.length>0){
    const crit=ev.filter(e=>e.impact==='CRITICAL');
    t.textContent=crit.length>0
      ?`CRITICAL: ${crit[0].name} — ${crit[0].window}. Agent in maximum caution mode.`
      :`Upcoming: ${ev.map(e=>e.name).join(' · ')} — Factored into all signals.`;
    b.classList.add('show');
  }else{b.classList.remove('show');}
}

async function tg(token,chatId,text){
  const r=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:chatId,text,parse_mode:'HTML'})
  });
  const d=await r.json();if(!d.ok)throw new Error(d.description);
}

async function claude(prompt){
  const apiKey=document.getElementById('fApiKey').value.trim();
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:prompt}]})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content.map(i=>i.text||'').join('').trim();
}

function renderCard(sym,s){
  const area=document.getElementById('cardsArea');
  const old=document.getElementById('card-'+sym);if(old)old.remove();
  const dir=(s.signal||'NONE').toUpperCase();
  const dc=dir==='BUY'?'buy':dir==='SELL'?'sell':dir==='WAIT'?'wait':'none';
  const conf=Math.min(5,Math.max(1,parseInt(s.confidence)||3));
  const dots=Array.from({length:5},(_,i)=>`<div class="cdot${i<conf?' lit':''}"></div>`).join('');
  let lv='';
  if(dir==='BUY'||dir==='SELL'){
    lv=`<div class="levels">
      <div class="lv-item"><div class="lv-lbl">Entry</div><div class="lv-val e">${s.entry||'—'}</div></div>
      <div class="lv-item"><div class="lv-lbl">Stop Loss</div><div class="lv-val s">${s.stop||'—'}</div></div>
      <div class="lv-item"><div class="lv-lbl">Target 1</div><div class="lv-val t">${s.target1||'—'}</div></div>
      <div class="lv-item"><div class="lv-lbl">Target 2</div><div class="lv-val t">${s.target2||'—'}</div></div>
      <div class="lv-item"><div class="lv-lbl">R:R</div><div class="lv-val r">${s.rr||'—'}</div></div>
    </div>`;
  }
  const card=document.createElement('div');
  card.className='tc';card.id='card-'+sym;
  card.innerHTML=`<div class="tc-acc ${dc}"></div>
    <div class="tc-inner">
      <div class="tc-top">
        <div class="tc-sym">${sym}</div>
        <div class="tc-r">
          <div class="dir-badge ${dc}">${dir}</div>
          <div class="tc-strat">${s.strategy||'MULTI-STRAT'}</div>
        </div>
      </div>
      ${lv}
      <div class="tc-analysis">${s.analysis||''}</div>
      <div class="tc-footer">
        <div class="tc-time">${new Date().toUTCString().slice(0,22)} UTC</div>
        <div class="conf-row"><span class="conf-lbl">Conviction</span><div class="conf-dots">${dots}</div></div>
      </div>
    </div>`;
  area.insertBefore(card,area.firstChild);
}

function buildPrompt(symbols,strategies,news){
  const now=new Date();
  const h=now.getUTCHours();
  const day=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getUTCDay()];
  const isLondon=h>=7&&h<16,isNY=h>=13&&h<21,isAsian=h>=0&&h<7;
  const newsStr=news.length>0?news.map(e=>`${e.name} [${e.impact}/${e.window}]`).join(', '):'None immediately';
  const needed=Math.max(0,3-weekSigs);
  const daysLeft=[0,5,4,3,2,1,0][now.getUTCDay()]||1;

  return `You are an elite institutional FX trader with 15 years of prop desk experience at a top-tier bank. You have an exceptional track record identifying high-probability setups using pure technical analysis. A prospective high-net-worth client is evaluating you — they are experienced, sophisticated, and only impressed by precision, not noise.

YOUR MANDATE:
Generate minimum 3 trade signals per week across EUR/USD, GBP/USD, XAU/USD, WTI Oil.
Current week: ${weekSigs} signals sent. ${needed} more needed. ${daysLeft} trading days remaining this week.
${needed>0&&daysLeft<=2?'URGENCY: Week closing — actively identify qualifying setups. Lower confluence threshold to 1.5:1 R:R minimum if needed.':''}
${weekSigs>=3?'Weekly target met — ONLY fire on A+ setups with 2+ confluence factors.':''}

CURRENT SESSION:
- UTC: ${now.toUTCString()}
- Day: ${day}
- London session: ${isLondon?'ACTIVE':'CLOSED'}
- New York session: ${isNY?'ACTIVE':'CLOSED'}
- Asian session: ${isAsian?'ACTIVE':'CLOSED'}
- Scheduled news: ${newsStr}

MACRO CONTEXT (May 2026):
- Fed funds: 3.50–3.75% (held April 29 FOMC). Next FOMC: June 17 2026.
- NFP April data: May 8 2026 13:30 UTC. Prior: 178K.
- DXY: testing multi-year support ~96. Broadly bearish USD environment.
- EUR/USD: medium-term uptrend. Key support 1.1633–1.1611 (buy zone). Resistance 1.1849 (April high). Current ~1.1747.
- GBP/USD: testing 2026 resistance confluence 1.3575–1.3604 (2024 highs + 61.8% Fib + May open). Current ~1.3595.
- XAU/USD: rebounded from 4,500 to ~4,736. Key resistance 4,800. Support 4,620–4,640. Bullish bias.
- WTI Oil: volatile 88–100 range. Bearish short-term on Iran deal hopes. Broken support ~98.43–99.24.

STRATEGIES (apply in priority order):
1. SR_PA — Support/Resistance + Price Action: pin bars, engulfing, rejection candles at major structural levels with 2+ confluence (round number + Fib + swing high/low). Highest conviction.
2. LONDON_BO — London Breakout: Asian session range (00:00–07:00 UTC) high/low. Break with volume/momentum confirmation. Only valid 07:00–11:00 UTC.
3. BREAKOUT — Donchian Channel (20-period): confirmed candle close beyond channel. Trend-aligned only (price vs 200 EMA).
4. MA_CROSS — 20/50 EMA crossover on 4H with 200 EMA trend filter. Only trade in direction of 200 EMA.

Active: ${strategies.join(', ')}
Instruments: ${symbols.join(', ')}

NEWS RULES (non-negotiable):
- NFP/FOMC/CPI within 1 hour: signal = NONE for all USD pairs, explain why
- NFP/FOMC tomorrow: generate signals but recommend reduced position size (0.5% risk vs normal 1%)
- Always state if news within 24h

SIGNAL QUALITY STANDARDS:
- BUY/SELL: minimum 2 confluence factors + clear risk/reward
- Entry: specific price level (not a range)
- Stop: beyond nearest structure (swing high/low), not arbitrary
- Target 1: first significant resistance/support
- Target 2: next major level
- Minimum R:R: 1:1.5 (prefer 1:2+)
- Confidence 1–5: 5=institutional-grade, 3+=acceptable, below 3=WAIT not BUY/SELL
- WAIT: setup 70–90% formed, awaiting final confirmation candle
- NONE: no credible setup — do not force signals

RESPONSE: Return ONLY valid JSON. No markdown. No backticks. No preamble.
{
  "EURUSD":{
    "signal":"BUY|SELL|WAIT|NONE",
    "strategy":"strategy name",
    "entry":"exact price or null",
    "stop":"exact price or null",
    "target1":"exact price or null",
    "target2":"exact price or null",
    "rr":"1:X.X or null",
    "confidence":1-5,
    "analysis":"4 sentences. State: (1) the exact pattern observed, (2) the exact price level and why it matters structurally, (3) the trend context and any confluence, (4) news consideration if relevant. Write as a professional trader briefing a client. Be specific — mention actual price levels.",
    "telegramMsg":"Crisp 5-line summary for mobile alert"
  }
}
Analyse all requested instruments. Think like the best trader in the room.`;
}

async function scan(){
  const token=document.getElementById('fTok').value.trim();
  const chatId=document.getElementById('fChat').value.trim();
  const symbols=syms(),strategies=strats();
  if(!token||!chatId||symbols.length===0)return;

  scanN++;
  setStatus(true,'SCANNING');
  document.getElementById('scanLbl').textContent=`SCAN #${scanN}`;
  document.getElementById('feedMeta').textContent=`Scanning... ${new Date().toTimeString().slice(0,8)} UTC`;
  log('i',`Scan #${scanN} — ${symbols.join(' · ')}`);
  updateStats();

  const news=getNews();
  showBanner(news);

  let result;
  try{
    const raw=await claude(buildPrompt(symbols,strategies,news));
    const clean=raw.replace(/```json|```/g,'').trim();
    result=JSON.parse(clean);
  }catch(e){
    log('e','Parse error: '+e.message);
    setStatus(true,'MONITORING');
    resetTimer();
    return;
  }

  let fired=0;
  const now=new Date().toUTCString().slice(0,22);
  let tgMsg=`<b>⚡ APEX FX — SCAN #${scanN}</b>\n<i>${now} UTC</i>`;
  if(news.length>0)tgMsg+=`\n⚠️ <b>${news[0].name}</b>`;
  tgMsg+=`\n${'─'.repeat(30)}\n`;

  for(const sym of symbols){
    const s=result[sym];if(!s)continue;
    renderCard(sym,s);
    const dir=(s.signal||'NONE').toUpperCase();

    if(dir==='BUY'||dir==='SELL'){
      const em=dir==='BUY'?'🟢':'🔴';
      log('a',`${em} ${sym} ${dir} | ${s.entry} → SL:${s.stop} TP1:${s.target1} | R:R ${s.rr} | Conv:${s.confidence}/5`);
      totalSigs++;weekSigs++;fired++;
      tgMsg+=`\n${em} <b>${sym} — ${dir}</b>  [${s.strategy||''}]\n`;
      tgMsg+=`📍 Entry: <b>${s.entry}</b>\n`;
      tgMsg+=`🛑 Stop: ${s.stop}\n`;
      tgMsg+=`🎯 T1: ${s.target1}   T2: ${s.target2}\n`;
      tgMsg+=`⚖️ R:R ${s.rr||'—'}   Conviction: ${s.confidence}/5\n`;
      tgMsg+=`📊 ${s.telegramMsg||s.analysis||''}\n`;
    }else if(dir==='WAIT'){
      log('w',`⏳ ${sym} — Setup forming (${s.strategy||''})`);fired++;
      tgMsg+=`\n⏳ <b>${sym} — WATCH</b>  [${s.strategy||''}]\n${s.telegramMsg||s.analysis||''}\n`;
    }else{
      log('i',`${sym} — No setup`);
      tgMsg+=`\n◾ <b>${sym}</b> — No active setup\n`;
    }
  }

  updateStats();
  const weekNote=weekSigs>=3?`✅ Weekly target achieved (${weekSigs} signals)`:`📈 Week: ${weekSigs}/3 signals`;
  tgMsg+=`\n${'─'.repeat(30)}\n${weekNote}\n⏱ Next scan in ${scanMins}m`;

  try{
    await tg(token,chatId,tgMsg);
    log('s',`Telegram sent — ${fired} instrument(s) flagged`);
  }catch(e){
    log('e','Telegram: '+e.message);
  }

  setStatus(true,'MONITORING');
  resetTimer();
}

function resetTimer(){
  if(cdTimer)clearInterval(cdTimer);
  nextAt=Date.now()+scanMins*60*1000;
  cdTimer=setInterval(()=>{
    const rem=Math.max(0,nextAt-Date.now());
    const m=Math.floor(rem/60000),s=Math.floor((rem%60000)/1000);
    const str=`${m}:${s.toString().padStart(2,'0')}`;
    document.getElementById('cdVal').textContent=str;
    document.getElementById('stNext').textContent=str;
    if(rem<=0&&running)scan();
  },1000);
}

async function startAgent(){
  const apiKey=document.getElementById('fApiKey').value.trim();
  const token=document.getElementById('fTok').value.trim();
  const chatId=document.getElementById('fChat').value.trim();
  if(!apiKey){log('e','Enter Anthropic API Key');return;}
  if(!token){log('e','Enter Bot Token');return;}
  if(!chatId){log('e','Enter Chat ID');return;}
  if(syms().length===0){log('e','Select instruments');return;}

  running=true;
  document.getElementById('btnOn').style.display='none';
  document.getElementById('btnOff').style.display='block';
  document.getElementById('cdBar').classList.add('show');
  setStatus(true,'INITIALISING');

  log('s','APEX FX Agent — LIVE');
  log('i',`Instruments: ${syms().join(', ')}`);
  log('i',`Strategies: ${strats().join(', ')}`);
  log('i',`Interval: ${scanMins} minutes | Target: 3 signals/week`);

  const news=getNews();
  if(news.length>0)log('w','News: '+news.map(e=>e.name).join(', '));

  try{
    await tg(token,chatId,
      `✅ <b>APEX FX Agent — ACTIVATED</b>\n\n`+
      `📊 Instruments: ${syms().join(', ')}\n`+
      `⚙️ Strategies: ${strats().join(', ')}\n`+
      `⏱ Scan every ${scanMins} minutes\n`+
      `🎯 Target: minimum 3 trade signals/week\n`+
      `📐 Min R:R 1:1.5 | 1% risk per trade\n`+
      (news.length>0?`\n⚠️ Active events: ${news.map(e=>e.name).join(', ')}\n`:'')+
      `\nFirst scan starting now...`
    );
    log('s','Activation message sent to Telegram');
  }catch(e){
    log('e','Telegram failed — check token/Chat ID: '+e.message);
    stopAgent();return;
  }

  await scan();
}

function stopAgent(){
  running=false;
  if(cdTimer)clearInterval(cdTimer);
  document.getElementById('btnOn').style.display='block';
  document.getElementById('btnOff').style.display='none';
  document.getElementById('cdBar').classList.remove('show');
  document.getElementById('newsBanner').classList.remove('show');
  setStatus(false,'OFFLINE');
  document.getElementById('stNext').textContent='—';
  log('w','Agent stopped');
  const token=document.getElementById('fTok').value.trim();
  const chatId=document.getElementById('fChat').value.trim();
  if(token&&chatId)tg(token,chatId,'⛔ APEX FX Agent offline.').catch(()=>{});
}
</script>
